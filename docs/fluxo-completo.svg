<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="seta-cinza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <style>
      .titulo { font-size: 15px; font-weight: 700; fill: #fff; }
      .sub { font-size: 11px; fill: #fff; opacity: .9; }
      .txt { font-size: 12px; fill: #222; }
      .peq { font-size: 11px; fill: #555; }
      .neg { font-weight: 700; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; fill: #222; }
      .rot { font-size: 12px; fill: #222; font-weight: 600; }
      .rotp { font-size: 11px; fill: #555; }
      .cel { font-family: Consolas, monospace; font-size: 10px; fill: #fff; font-weight: 700; }
      .num { font-family: Consolas, monospace; font-size: 8.5px; fill: #666; }
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#ffffff"/>

  <!-- Título -->
  <text x="30" y="40" font-size="22" font-weight="700" fill="#222">Fluxo completo do pipeline: PostgreSQL → Kafka → MinIO</text>
  <text x="30" y="62" font-size="13" fill="#555">Sem código de aplicação: só configuração (docker-compose + 2 JSONs enviados à API do Kafka Connect)</text>

  <!-- ================= ZOOKEEPER ================= -->
  <rect x="560" y="80" width="280" height="70" rx="8" fill="#f4f4f4" stroke="#888"/>
  <text x="700" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Zookeeper</text>
  <text x="700" y="124" text-anchor="middle" class="peq">zookeeper:2181 · coordena o cluster</text>
  <text x="700" y="140" text-anchor="middle" class="peq">brokers vivos · líderes · config dos tópicos</text>
  <line x1="700" y1="150" x2="700" y2="188" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" marker-start="url(#seta-cinza)"/>
  <text x="710" y="174" class="rotp">o broker se registra (/brokers/ids = [1])</text>

  <!-- ================= POSTGRESQL ================= -->
  <rect x="30" y="190" width="340" height="300" rx="8" fill="#eef3f8" stroke="#336791" stroke-width="1.5"/>
  <rect x="30" y="190" width="340" height="50" rx="8" fill="#336791"/>
  <rect x="30" y="225" width="340" height="15" fill="#336791"/>
  <text x="45" y="213" class="titulo">PostgreSQL 16 (origem)</text>
  <text x="45" y="231" class="sub">postgres:5432 · banco lab_eda_kafka</text>
  <text x="45" y="264" class="txt"><tspan class="neg">schema inventory</tspan> (postgres/init/01-inventory.sql)</text>
  <text x="55" y="282" class="peq">products · customers · orders · products_on_hand</text>
  <text x="45" y="308" class="txt"><tspan class="neg">wal_level = logical</tspan></text>
  <text x="55" y="326" class="peq">toda alteração é registrada no WAL antes da tabela</text>
  <text x="45" y="352" class="txt"><tspan class="neg">REPLICA IDENTITY FULL</tspan></text>
  <text x="55" y="370" class="peq">o WAL guarda a linha inteira → "before" completo</text>
  <text x="45" y="396" class="txt">Criados pelo Debezium:</text>
  <text x="55" y="414" class="peq">• slot de replicação <tspan class="neg" fill="#222">debezium</tspan> (plugin pgoutput)</text>
  <text x="55" y="432" class="peq">• publicação <tspan class="neg" fill="#222">dbz_publication</tspan></text>
  <text x="45" y="460" class="txt">INSERT / UPDATE / DELETE  →  WAL</text>

  <!-- ================= KAFKA ================= -->
  <rect x="530" y="190" width="340" height="300" rx="8" fill="#f5f5f5" stroke="#231f20" stroke-width="1.5"/>
  <rect x="530" y="190" width="340" height="50" rx="8" fill="#231f20"/>
  <rect x="530" y="225" width="340" height="15" fill="#231f20"/>
  <text x="545" y="213" class="titulo">Kafka broker</text>
  <text x="545" y="231" class="sub">kafka-broker:29092 (interno) · localhost:9092 (externo)</text>
  <text x="545" y="262" class="txt"><tspan class="neg">Tópicos</tspan> (criados automaticamente · padrão 1 partição)</text>
  <text x="555" y="280" class="peq">• postgres.inventory.products</text>
  <text x="555" y="297" class="peq">• postgres.inventory.customers · orders · products_on_hand</text>
  <text x="545" y="322" class="txt">products · partição 0 · offsets:</text>

  <!-- células de offset -->
  <g>
    <rect x="555" y="330" width="17" height="22" fill="#5b8bd0"/><text x="563.5" y="345" text-anchor="middle" class="cel">r</text>
    <rect x="573" y="330" width="17" height="22" fill="#5b8bd0"/><text x="581.5" y="345" text-anchor="middle" class="cel">r</text>
    <rect x="591" y="330" width="17" height="22" fill="#5b8bd0"/><text x="599.5" y="345" text-anchor="middle" class="cel">r</text>
    <rect x="609" y="330" width="17" height="22" fill="#5b8bd0"/><text x="617.5" y="345" text-anchor="middle" class="cel">r</text>
    <rect x="627" y="330" width="17" height="22" fill="#5b8bd0"/><text x="635.5" y="345" text-anchor="middle" class="cel">r</text>
    <rect x="645" y="330" width="17" height="22" fill="#5b8bd0"/><text x="653.5" y="345" text-anchor="middle" class="cel">r</text>
    <rect x="663" y="330" width="17" height="22" fill="#5b8bd0"/><text x="671.5" y="345" text-anchor="middle" class="cel">r</text>
    <rect x="681" y="330" width="17" height="22" fill="#5b8bd0"/><text x="689.5" y="345" text-anchor="middle" class="cel">r</text>
    <rect x="699" y="330" width="17" height="22" fill="#5b8bd0"/><text x="707.5" y="345" text-anchor="middle" class="cel">r</text>
    <rect x="717" y="330" width="17" height="22" fill="#2e9e5b"/><text x="725.5" y="345" text-anchor="middle" class="cel">c</text>
    <rect x="735" y="330" width="17" height="22" fill="#d99a1e"/><text x="743.5" y="345" text-anchor="middle" class="cel">u</text>
    <rect x="753" y="330" width="17" height="22" fill="#c0392b"/><text x="761.5" y="345" text-anchor="middle" class="cel">d</text>
    <rect x="771" y="330" width="17" height="22" fill="#fff" stroke="#999" stroke-dasharray="2 2"/><text x="779.5" y="345" text-anchor="middle" class="cel" fill="#999">∅</text>
    <rect x="789" y="330" width="17" height="22" fill="#2e9e5b"/><text x="797.5" y="345" text-anchor="middle" class="cel">c</text>
    <rect x="807" y="330" width="17" height="22" fill="#2e9e5b"/><text x="815.5" y="345" text-anchor="middle" class="cel">c</text>
    <rect x="825" y="330" width="17" height="22" fill="#2e9e5b"/><text x="833.5" y="345" text-anchor="middle" class="cel">c</text>
    <text x="563.5" y="363" text-anchor="middle" class="num">0</text>
    <text x="581.5" y="363" text-anchor="middle" class="num">1</text>
    <text x="599.5" y="363" text-anchor="middle" class="num">2</text>
    <text x="617.5" y="363" text-anchor="middle" class="num">3</text>
    <text x="635.5" y="363" text-anchor="middle" class="num">4</text>
    <text x="653.5" y="363" text-anchor="middle" class="num">5</text>
    <text x="671.5" y="363" text-anchor="middle" class="num">6</text>
    <text x="689.5" y="363" text-anchor="middle" class="num">7</text>
    <text x="707.5" y="363" text-anchor="middle" class="num">8</text>
    <text x="725.5" y="363" text-anchor="middle" class="num">9</text>
    <text x="743.5" y="363" text-anchor="middle" class="num">10</text>
    <text x="761.5" y="363" text-anchor="middle" class="num">11</text>
    <text x="779.5" y="363" text-anchor="middle" class="num">12</text>
    <text x="797.5" y="363" text-anchor="middle" class="num">13</text>
    <text x="815.5" y="363" text-anchor="middle" class="num">14</text>
    <text x="833.5" y="363" text-anchor="middle" class="num">15</text>
  </g>
  <text x="545" y="384" class="peq">r snapshot · c insert · u update · d delete · ∅ tombstone</text>
  <text x="545" y="400" class="peq">chave = PK (id) → mesma partição, ordem garantida</text>
  <text x="545" y="428" class="txt"><tspan class="neg">Tópicos internos do Connect</tspan></text>
  <text x="555" y="446" class="peq">connect-configs · connect-offsets · connect-status</text>
  <text x="555" y="463" class="peq">(o Connect guarda o próprio estado no Kafka;</text>
  <text x="555" y="478" class="peq">connect-offsets = posição no WAL do Debezium)</text>

  <!-- ================= MINIO ================= -->
  <rect x="1030" y="190" width="340" height="300" rx="8" fill="#fbeff1" stroke="#c72c48" stroke-width="1.5"/>
  <rect x="1030" y="190" width="340" height="50" rx="8" fill="#c72c48"/>
  <rect x="1030" y="225" width="340" height="15" fill="#c72c48"/>
  <text x="1045" y="213" class="titulo">MinIO (Data Lake)</text>
  <text x="1045" y="231" class="sub">minio:9000 API S3 · localhost:9001 console</text>
  <text x="1045" y="262" class="txt"><tspan class="neg">bucket bronze</tspan> = dado bruto (histórico de alterações)</text>
  <text x="1045" y="282" class="mono" font-size="10.5">topics/postgres.inventory.products/</text>
  <text x="1055" y="297" class="mono" font-size="10.5">partition=0/</text>
  <text x="1065" y="318" class="mono" font-size="10.5">...products+0+0000000000.json</text><text x="1290" y="318" class="peq">r r r</text>
  <text x="1065" y="335" class="mono" font-size="10.5">...products+0+0000000003.json</text><text x="1290" y="335" class="peq">r r r</text>
  <text x="1065" y="352" class="mono" font-size="10.5">...products+0+0000000006.json</text><text x="1290" y="352" class="peq">r r r</text>
  <text x="1065" y="369" class="mono" font-size="10.5">...products+0+0000000009.json</text><text x="1290" y="369" class="peq">c u d</text>
  <text x="1065" y="386" class="mono" font-size="10.5">...products+0+0000000013.json</text><text x="1290" y="386" class="peq">c c c</text>
  <text x="1045" y="410" class="peq">nome = tópico + partição + offset da 1ª mensagem</text>
  <text x="1045" y="426" class="peq">offset 12 (tombstone) foi ignorado → pula de 9 para 13</text>
  <text x="1045" y="452" class="txt"><tspan class="neg">silver / gold</tspan>: próximas camadas</text>
  <text x="1045" y="470" class="peq">(reconstruir o estado atual, agregações)</text>

  <!-- ================= KAFKA CONNECT ================= -->
  <rect x="30" y="590" width="1340" height="270" rx="10" fill="#f6f1fb" stroke="#6b3fa0" stroke-width="1.5"/>

  <!-- Source -->
  <rect x="60" y="605" width="600" height="185" rx="8" fill="#fff" stroke="#6b3fa0"/>
  <text x="75" y="629" font-size="14" font-weight="700" fill="#222">Conector SOURCE · Debezium PostgresConnector</text>
  <text x="75" y="647" class="peq">connector-postgres · conectores/conector-postgres.json · tasks.max = 1 · papel: PRODUCER</text>
  <text x="75" y="673" class="txt"><tspan class="neg">1º snapshot:</tspan> lê as linhas que já existem → op "r"</text>
  <text x="75" y="693" class="txt"><tspan class="neg">depois, CDC:</tspan> acompanha o WAL → op "c", "u", "d" (+ tombstone no DELETE)</text>
  <text x="75" y="713" class="txt"><tspan class="neg">plugin.name = pgoutput</tspan> (nativo do Postgres 16)</text>
  <text x="75" y="733" class="txt"><tspan class="neg">topic.prefix = postgres</tspan> → tópico &lt;prefixo&gt;.&lt;schema&gt;.&lt;tabela&gt;</text>
  <text x="75" y="753" class="txt"><tspan class="neg">schema.include.list = inventory</tspan></text>
  <text x="75" y="777" class="peq">JSON converter, schemas.enable = false → mensagens só com os dados</text>

  <!-- Sink -->
  <rect x="740" y="605" width="600" height="185" rx="8" fill="#fff" stroke="#6b3fa0"/>
  <text x="755" y="629" font-size="14" font-weight="700" fill="#222">Conector SINK · Confluent S3SinkConnector</text>
  <text x="755" y="647" class="peq">connector-minio · conectores/conector-minio.json · papel: CONSUMER</text>
  <text x="755" y="673" class="txt"><tspan class="neg">consumer group:</tspan> connect-connector-minio (offset e LAG)</text>
  <text x="755" y="693" class="txt"><tspan class="neg">topics</tspan> = postgres.inventory.products</text>
  <text x="755" y="713" class="txt"><tspan class="neg">flush.size = 3</tspan> → 1 arquivo a cada 3 mensagens</text>
  <text x="755" y="733" class="txt"><tspan class="neg">behavior.on.null.values = ignore</tspan> → descarta tombstones</text>
  <text x="755" y="753" class="txt"><tspan class="neg">store.url</tspan> = http://minio:9000 · bucket bronze · formato JSON</text>
  <text x="755" y="777" class="peq">credencial própria (Access Key), não o admin do MinIO</text>

  <!-- Cabeçalho do Connect (embaixo, para as setas não cruzarem o texto) -->
  <text x="50" y="820" font-size="16" font-weight="700" fill="#6b3fa0">Kafka Connect (worker)</text>
  <text x="250" y="820" class="peq">connect:8083 API REST · group.id = connect · os 2 conectores rodam no mesmo worker · criados com PUT /connectors/&lt;nome&gt;/config</text>
  <text x="50" y="842" class="peq">Credenciais via Config Provider:  .env  →  environment do connect  →  ${env:PG_*} / ${env:MINIO_*} nos JSONs (a senha não fica gravada)</text>

  <!-- ================= SETAS ================= -->
  <!-- 1 e 2: Postgres -> Source -->
  <line x1="200" y1="490" x2="200" y2="603" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="212" y="530" class="rot">① snapshot (lê a tabela)</text>
  <text x="212" y="548" class="rot">② WAL via slot debezium</text>

  <!-- 3: Source -> Kafka -->
  <line x1="600" y1="605" x2="600" y2="492" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="588" y="530" text-anchor="end" class="rot">③ produz eventos</text>
  <text x="588" y="548" text-anchor="end" class="rotp">kafka-broker:29092</text>

  <!-- 4: Kafka -> Sink -->
  <line x1="800" y1="490" x2="800" y2="603" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="812" y="530" class="rot">④ consome</text>
  <text x="812" y="548" class="rotp">kafka-broker:29092</text>

  <!-- 5: Sink -> MinIO -->
  <line x1="1200" y1="605" x2="1200" y2="492" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="1212" y="530" class="rot">⑤ grava arquivos</text>
  <text x="1212" y="548" class="rotp">API S3 · minio:9000</text>

  <!-- 6: MinIO -> Kafka (Parte 7, pendente) -->
  <line x1="1030" y1="300" x2="872" y2="300" stroke="#999" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#seta-cinza)"/>
  <text x="951" y="288" text-anchor="middle" class="rot" fill="#888">⑥ Parte 7 (pendente)</text>
  <text x="951" y="318" text-anchor="middle" class="rotp">"arquivo criado"</text>
  <text x="951" y="333" text-anchor="middle" class="rotp">→ tópico sink-products</text>

  <!-- ================= EVENTO ================= -->
  <rect x="30" y="885" width="1340" height="100" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="45" y="907" class="txt"><tspan class="neg">Um evento do Debezium</tspan>  (1 alteração no banco = 1 mensagem no Kafka = 1 linha no arquivo do MinIO)</text>
  <text x="45" y="932" class="mono">{"op":"u", "before":{"id":110,"name":"Lapis","description":"O melhor","weight":1.0}, "after":{"id":110,"name":"Lapis","description":"O melhor","weight":2.0},</text>
  <text x="45" y="950" class="mono"> "source":{"db":"lab_eda_kafka","schema":"inventory","table":"products","lsn":26754024,"txId":769,"snapshot":"false"}, "ts_ms":1791882626738}</text>
  <text x="45" y="973" class="peq">op = o que aconteceu · before / after = a linha antes e depois · source = de onde veio (tabela, posição no WAL, transação) · ts_ms = quando</text>
</svg>
